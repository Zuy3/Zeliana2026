      (function() {
        try {
          var realFetch = window.fetch;
          var currentFetch = function() {
            return realFetch ? realFetch.apply(window, arguments) : Promise.reject(new Error('Fetch not available'));
          };
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
